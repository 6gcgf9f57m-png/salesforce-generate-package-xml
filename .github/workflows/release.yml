name: Release

# ──────────────────────────────────────────────
# トリガー: main への push
#
# python-semantic-release が Conventional Commits を解析し、
#   1. pyproject.toml / __init__.py のバージョンを更新
#   2. CHANGELOG.md にリリースノートを追記
#   3. git commit & tag を作成・push
#   4. GitHub Release を作成
# まで自動実行する。手動での bump-version.yml 実行は不要。
# ──────────────────────────────────────────────
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install "python-semantic-release>=10.6.1"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          semantic-release version --push
          semantic-release publish
